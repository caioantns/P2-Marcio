{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login">
  <form method="post" class="painel formulario" novalidate>
    {% csrf_token %}
    <h1>Entrar</h1>
    <p class="ajuda" style="margin-bottom:1rem">Use o usuário da sua clínica.</p>
    {% if form.errors %}
      <div class="erros-gerais" role="alert">Usuário ou senha incorretos.</div>
    {% endif %}
    <div class="campo">
      <label for="{{ form.username.id_for_label }}">Usuário</label>
      {{ form.username }}
    </div>
    <div class="campo">
      <label for="{{ form.password.id_for_label }}">Senha</label>
      {{ form.password }}
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="botao botao--primario">Entrar</button>
  </form>
</div>
{% endblock %}
