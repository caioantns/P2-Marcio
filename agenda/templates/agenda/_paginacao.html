{% if is_paginated %}
<nav class="paginacao" aria-label="Paginação">
  {% if page_obj.has_previous %}<a class="botao botao--pequeno" href="?{% if parametros %}{{ parametros }}&{% endif %}page={{ page_obj.previous_page_number }}">‹ Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="botao botao--pequeno" href="?{% if parametros %}{{ parametros }}&{% endif %}page={{ page_obj.next_page_number }}">Próxima ›</a>{% endif %}
</nav>
{% endif %}
